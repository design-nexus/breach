[package]
name = "breach"
version = "0.1.0"
rust-version = "1.88"
edition = "2024"
description = "breach — Aurora TUI frontend for Metasploit Framework"
license = "MIT"
repository = "https://github.com/design-nexus/breach"
homepage = "https://github.com/design-nexus/breach"
readme = "README.md"
keywords = ["metasploit", "tui", "security", "pentest"]
categories = ["command-line-utilities"]

[[bin]]
name = "breach"
path = "src/main.rs"

[dependencies]
unicode-width = "0.2"
notify = "8"
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
chrono = { version = "0.4.45", features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
ratatui = { version = "=0.30.2", features = ["crossterm_0_29"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmpv = "1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
